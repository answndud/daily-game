<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시그널 노치</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div>
        <p class="eyebrow">2026-05-06 Daily Game</p>
        <h1>시그널 노치</h1>
        <p class="summary">원형 다이얼을 돌려 신호 바늘을 목표 노치 안에 고정하세요.</p>
      </div>
      <button id="resetButton" class="secondary-button" type="button">처음부터</button>
    </header>

    <section class="status-grid" aria-label="게임 상태">
      <article>
        <span>라운드</span>
        <strong id="roundValue">1</strong>
      </article>
      <article>
        <span>보정</span>
        <strong><span id="scoreValue">0</span>/<span id="targetValue">6</span></strong>
      </article>
      <article>
        <span>잡음</span>
        <strong><span id="faultValue">0</span>/3</strong>
      </article>
      <article>
        <span>고정</span>
        <strong id="holdValue">0.0</strong>
      </article>
    </section>

    <section class="play-card" aria-label="시그널 노치 플레이 영역">
      <canvas id="gameCanvas" width="720" height="900"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlayLabel" class="overlay-label">시작</p>
        <h2 id="overlayTitle">다이얼을 돌려 맞추세요</h2>
        <p id="overlayText">손가락으로 원형 다이얼을 돌려 바늘을 밝은 목표 노치 안에 유지하세요.</p>
        <button id="startButton" type="button">시작</button>
      </div>
    </section>

    <p id="messageLine" class="message">바늘이 목표 노치 안에 1초 동안 머물면 보정됩니다.</p>
  </main>
</body>
</html>
