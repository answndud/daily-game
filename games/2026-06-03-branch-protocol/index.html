<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>분기 프로토콜</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="shell">
      <section class="brief" aria-labelledby="title">
        <p class="eyebrow">2026-06-03 · 프로토콜 판단 전략</p>
        <h1 id="title">분기 프로토콜</h1>
        <p class="lead">사건 카드의 조건을 읽고 세 가지 처리 방식 중 하나를 고르세요. 신뢰도, 부하, 추적성이 모두 안정권에 있어야 다음 라운드로 넘어갑니다.</p>
        <div class="rules">
          <span>클리어: 다음 라운드</span>
          <span>실패: 라운드 1</span>
          <span>키보드: 1 · 2 · 3</span>
        </div>
      </section>

      <section class="console" aria-label="프로토콜 콘솔">
        <div class="hud">
          <div><span>라운드</span><strong id="round">1</strong></div>
          <div><span>처리</span><strong id="step">1/6</strong></div>
          <div><span>오판</span><strong id="faults">0/2</strong></div>
        </div>

        <div class="meters" aria-label="시스템 지표">
          <div class="meter">
            <div class="meter-head"><span>신뢰도</span><strong id="trustText">50</strong></div>
            <div class="track"><span id="trustBar"></span></div>
          </div>
          <div class="meter">
            <div class="meter-head"><span>부하</span><strong id="loadText">50</strong></div>
            <div class="track"><span id="loadBar"></span></div>
          </div>
          <div class="meter">
            <div class="meter-head"><span>추적성</span><strong id="traceText">50</strong></div>
            <div class="track"><span id="traceBar"></span></div>
          </div>
        </div>

        <article class="event-card">
          <p id="eventType" class="event-type">사건 대기</p>
          <h2 id="eventTitle">시작 준비</h2>
          <p id="eventBody">첫 사건이 표시되면 조건에 맞는 분기를 선택하세요.</p>
          <p id="hint" class="hint">힌트: 카드 하단의 조건 문장을 기준으로 판단합니다.</p>
        </article>

        <div class="actions" role="group" aria-label="분기 선택">
          <button id="quarantine" type="button"><span>1</span>격리</button>
          <button id="reroute" type="button"><span>2</span>전환</button>
          <button id="pass" type="button"><span>3</span>통과</button>
        </div>

        <div class="status">
          <p id="status">사건을 읽고 분기를 선택하세요.</p>
          <button id="restart" type="button">라운드 1부터 다시</button>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
