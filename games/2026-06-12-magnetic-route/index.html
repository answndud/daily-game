<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자석 항로</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" aria-labelledby="gameTitle">
    <header class="header">
      <p class="kicker">2026년 6월 12일 · 자기 물리 유도</p>
      <h1 id="gameTitle">자석 항로</h1>
      <p class="summary">캡슐은 관성으로 표류합니다. 자기장을 끌어당김, 중립, 밀어냄으로 바꿔 모든 코어를 지나가게 하세요.</p>
    </header>

    <section class="hud" aria-label="진행 상태">
      <div>
        <span>라운드</span>
        <strong id="roundText">1</strong>
      </div>
      <div>
        <span>수집</span>
        <strong id="coreText">0 / 3</strong>
      </div>
      <div>
        <span>에너지</span>
        <strong id="energyText">100</strong>
      </div>
      <div>
        <span>자기장</span>
        <strong id="fieldText">중립</strong>
      </div>
    </section>

    <section class="arena-wrap" aria-label="자석 항로 경기장">
      <canvas id="gameCanvas" width="360" height="360"></canvas>
      <p id="statusText" class="status" aria-live="polite">자기장을 선택해 캡슐을 코어 쪽으로 유도하세요.</p>
    </section>

    <section class="controls" aria-label="자기장 조작">
      <button type="button" data-field="-1">밀어냄</button>
      <button type="button" data-field="0" class="is-active">중립</button>
      <button type="button" data-field="1">끌어당김</button>
      <button id="restartButton" type="button" class="restart">라운드 1부터 재시작</button>
    </section>

    <section class="rules">
      <h2>규칙</h2>
      <p>캡슐이 코어에 닿으면 수집됩니다. 모든 코어를 모으면 더 많은 코어와 위험 띠가 있는 다음 라운드로 바로 이동합니다.</p>
      <p>에너지가 0이 되거나 붉은 위험 띠에 닿으면 실패하며 라운드 1로 돌아갑니다. 키보드는 <kbd>A</kbd> 밀어냄, <kbd>S</kbd> 중립, <kbd>D</kbd> 끌어당김입니다.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
