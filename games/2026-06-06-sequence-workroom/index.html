<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>작업 순서실</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="shell">
      <section class="brief" aria-labelledby="title">
        <p class="eyebrow">2026-06-06 · 의존성 순서 퍼즐</p>
        <h1 id="title">작업 순서실</h1>
        <p class="lead">작업 카드의 전후 관계 단서를 읽고 인접한 두 카드만 교환하세요. 모든 작업이 올바른 순서가 되면 다음 라운드로 바로 이동합니다.</p>
        <div class="rules">
          <span>클리어: 다음 라운드</span>
          <span>실패: 라운드 1</span>
          <span>조작: 인접 교환</span>
        </div>
      </section>

      <section class="panel" aria-label="작업 순서실 게임판">
        <div class="hud">
          <div><span>라운드</span><strong id="round">1</strong></div>
          <div><span>묶음</span><strong id="stage">1/2</strong></div>
          <div><span>남은 이동</span><strong id="moves">8</strong></div>
        </div>

        <article class="clue-card">
          <p class="label">정렬 단서</p>
          <ul id="clues"></ul>
        </article>

        <div id="cards" class="cards" aria-label="작업 카드"></div>

        <div class="actions">
          <button id="left" type="button">선택 작업 왼쪽 교환</button>
          <button id="right" type="button">선택 작업 오른쪽 교환</button>
        </div>

        <p id="status" class="status">카드를 하나 선택한 뒤 왼쪽 또는 오른쪽으로 인접 교환하세요.</p>
        <button id="restart" class="restart" type="button">라운드 1부터 다시</button>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
