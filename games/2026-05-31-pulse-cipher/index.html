<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>박자 암호 - 2026-05-31</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="kicker">2026-05-31 일일 게임</p>
        <h1>박자 암호</h1>
        <p class="summary">짧음, 김, 쉼으로 이루어진 박자 전보를 순서대로 해독하세요.</p>
      </header>

      <section class="panel" aria-label="박자 암호 게임">
        <div class="hud" aria-live="polite">
          <div>
            <span>라운드</span>
            <strong id="roundValue">1</strong>
          </div>
          <div>
            <span>전보</span>
            <strong id="scoreValue">0/3</strong>
          </div>
          <div>
            <span>입력</span>
            <strong id="inputValue">0/5</strong>
          </div>
          <div>
            <span>시간</span>
            <strong id="timeValue">20</strong>
          </div>
        </div>

        <div class="stage">
          <section class="cipher" aria-label="박자 전보">
            <div id="pattern" class="pattern" aria-label="목표 박자"></div>
            <div id="entered" class="entered" aria-label="입력한 박자"></div>
            <p id="hintLine" class="hint">전보를 왼쪽부터 입력하세요.</p>
          </section>

          <aside class="console">
            <h2>입력 패드</h2>
            <p>표시된 박자를 순서대로 누르세요. 한 번이라도 틀리면 라운드 1로 돌아갑니다.</p>
            <div class="pads">
              <button id="shortButton" type="button" data-symbol="short">짧음</button>
              <button id="longButton" type="button" data-symbol="long">김</button>
              <button id="restButton" type="button" data-symbol="rest">쉼</button>
            </div>
            <div class="actions">
              <button id="resetButton" type="button">현재 전보 다시</button>
            </div>
          </aside>
        </div>

        <p id="messageLine" class="message">시작을 누른 뒤 박자 전보를 해독하세요.</p>
      </section>

      <section id="overlay" class="overlay" aria-live="polite">
        <div class="overlay-card">
          <p class="kicker">전보 해독실</p>
          <h2 id="overlayTitle">박자 암호 준비</h2>
          <p id="overlayText">짧음, 김, 쉼으로 된 전보를 정확히 입력하세요. 실패하면 라운드 1부터 다시 시작합니다.</p>
          <button id="startButton" type="button">라운드 1 시작</button>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
