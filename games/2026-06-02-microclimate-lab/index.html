<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>미세 기후실</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="intro-panel" aria-labelledby="game-title">
        <p class="eyebrow">2026-06-02 · 기후 확산 퍼즐</p>
        <h1 id="game-title">미세 기후실</h1>
        <p class="summary">열기와 냉기 펄스를 주입하면 온도가 주변 셀로 번집니다. 표시된 목표 돔을 모두 안정권에 맞추세요.</p>
        <div class="rule-grid" aria-label="게임 규칙">
          <span>클리어: 다음 라운드</span>
          <span>실패: 라운드 1</span>
          <span>조작: 셀 선택</span>
        </div>
      </section>

      <section class="play-panel" aria-label="미세 기후실 게임판">
        <div class="hud">
          <div>
            <span class="label">라운드</span>
            <strong id="round">1</strong>
          </div>
          <div>
            <span class="label">실험</span>
            <strong id="stage">1/2</strong>
          </div>
          <div>
            <span class="label">남은 펄스</span>
            <strong id="moves">8</strong>
          </div>
        </div>

        <div class="mode-row" role="group" aria-label="펄스 종류 선택">
          <button id="heat-mode" class="mode-button active" type="button">열기 +</button>
          <button id="cool-mode" class="mode-button" type="button">냉기 -</button>
        </div>

        <div id="board" class="board" aria-label="기후 격자"></div>

        <div class="status-card">
          <p id="status">시작하려면 펄스 종류를 고르고 셀을 누르세요.</p>
          <button id="restart" type="button">라운드 1부터 다시</button>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
