<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>타이드 스위치</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div>
        <p class="eyebrow">2026-05-04 Daily Game</p>
        <h1>타이드 스위치</h1>
        <p class="summary">내려오는 파형 타일을 보고 좌우로 스와이프해 알맞은 수문으로 분류하세요.</p>
      </div>
      <button id="resetButton" class="secondary-button" type="button">처음부터</button>
    </header>

    <section class="status-grid" aria-label="게임 상태">
      <article>
        <span>라운드</span>
        <strong id="roundValue">1</strong>
      </article>
      <article>
        <span>분류</span>
        <strong><span id="scoreValue">0</span>/<span id="targetValue">10</span></strong>
      </article>
      <article>
        <span>오류</span>
        <strong><span id="faultValue">0</span>/3</strong>
      </article>
      <article>
        <span>연속</span>
        <strong id="comboValue">0</strong>
      </article>
    </section>

    <section class="play-card" aria-label="타이드 스위치 플레이 영역">
      <canvas id="gameCanvas" width="720" height="900"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlayLabel" class="overlay-label">시작</p>
        <h2 id="overlayTitle">파형을 수문으로 보내세요</h2>
        <p id="overlayText">CREST는 오른쪽, TROUGH는 왼쪽입니다. 화면을 좌우로 스와이프하거나 방향키를 누르세요.</p>
        <button id="startButton" type="button">시작</button>
      </div>
    </section>

    <p id="messageLine" class="message">CREST는 오른쪽, TROUGH는 왼쪽으로 분류하세요.</p>
  </main>
</body>
</html>
