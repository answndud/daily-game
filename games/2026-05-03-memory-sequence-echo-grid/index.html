<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에코 그리드</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div>
        <p class="eyebrow">2026-05-03 Daily Game</p>
        <h1>에코 그리드</h1>
        <p class="summary">짧게 빛나는 패드 순서를 기억하고 같은 순서로 탭해 신호를 되돌리세요.</p>
      </div>
      <button id="resetButton" class="secondary-button" type="button">처음부터</button>
    </header>

    <section class="status-grid" aria-label="게임 상태">
      <article>
        <span>라운드</span>
        <strong id="roundValue">1</strong>
      </article>
      <article>
        <span>신호</span>
        <strong><span id="scoreValue">0</span>/<span id="targetValue">4</span></strong>
      </article>
      <article>
        <span>오류</span>
        <strong><span id="faultValue">0</span>/3</strong>
      </article>
      <article>
        <span>순서</span>
        <strong><span id="stepValue">0</span>/<span id="lengthValue">3</span></strong>
      </article>
    </section>

    <section class="play-card" aria-label="에코 그리드 플레이 영역">
      <div id="padGrid" class="pad-grid" aria-label="기억 패드 9개"></div>
      <div id="overlay" class="overlay">
        <p id="overlayLabel" class="overlay-label">시작</p>
        <h2 id="overlayTitle">빛 순서를 기억하세요</h2>
        <p id="overlayText">패드가 보여 준 순서를 같은 순서로 탭하면 신호가 복원됩니다.</p>
        <button id="startButton" type="button">시작</button>
      </div>
    </section>

    <p id="messageLine" class="message">빛 순서가 끝난 뒤 같은 순서로 패드를 탭하세요.</p>
  </main>
</body>
</html>
